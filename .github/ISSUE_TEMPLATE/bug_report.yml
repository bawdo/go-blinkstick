name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce
      description: The smallest code that shows the problem.
      render: go
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      multiple: true
      options:
        - BlinkStick Nano
        - BlinkStick Square
        - Other
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS and version
      placeholder: macOS 26.1, Ubuntu 26.04
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Go and package versions
      placeholder: go1.27.1, go-blinkstick v0.5.0
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Error output, logs, or whether it happens on another stick.
